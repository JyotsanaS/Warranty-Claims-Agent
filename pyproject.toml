[project]
name = "chargepoint"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chonkie>=1.6.1",
    "pinecone>=3.0.0",
    "sentence-transformers>=3.0.0",
    "python-dotenv>=1.0.0",
    "streamlit>=1.35.0",
    "httpx>=0.27.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic-settings>=2.0.0",
    "python-multipart>=0.0.9",
    "litellm>=1.30.0",
    "langgraph>=0.2.0",
    "openinference-instrumentation>=0.1.46",
    "openinference-instrumentation-litellm>=0.1.30",
    "opentelemetry-sdk>=1.40.0",
    "guardrails-ai>=0.5.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ragas>=0.4.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "integration: tests that make real LLM/API calls (require .env credentials)",
]
